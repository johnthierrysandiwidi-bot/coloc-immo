<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Chambre">
  <rect width="640" height="400" fill="#F0E9DC"/>
  <rect y="292" width="640" height="8" fill="#C9AC8C"/>
  <rect y="300" width="640" height="100" fill="#D8CBB8"/>
  <g stroke="#C4B49F" stroke-width="2">
    <line x1="0" y1="334" x2="640" y2="334"/><line x1="0" y1="366" x2="640" y2="366"/>
    <line x1="120" y1="300" x2="90" y2="400"/><line x1="300" y1="300" x2="296" y2="400"/>
    <line x1="480" y1="300" x2="510" y2="400"/>
  </g>

  <!-- fenêtre -->
  <rect x="60" y="70" width="128" height="98" rx="4" fill="#B9D4E0"/>
  <rect x="60" y="70" width="128" height="98" rx="4" fill="none" stroke="#C9AC8C" stroke-width="6"/>
  <g stroke="#D9E7EE" stroke-width="2"><line x1="124" y1="70" x2="124" y2="168"/></g>

  <!-- ventilateur -->
  <rect x="316" y="0" width="8" height="22" fill="#8A9BA8"/>
  <circle cx="320" cy="28" r="8" fill="#8A9BA8"/>
  <g fill="#9FB0BC">
    <rect x="248" y="25" width="72" height="6" rx="3"/>
    <rect x="320" y="25" width="72" height="6" rx="3"/>
  </g>

  <!-- lit avec moustiquaire relevée -->
  <rect x="230" y="222" width="290" height="62" rx="8" fill="#8A6A4A"/>
  <rect x="230" y="200" width="290" height="30" rx="8" fill="#E8D5B7"/>
  <rect x="216" y="150" width="18" height="140" rx="4" fill="#6B4A2F"/>
  <rect x="516" y="188" width="16" height="102" rx="4" fill="#6B4A2F"/>
  <!-- oreillers et drap -->
  <rect x="248" y="204" width="72" height="26" rx="8" fill="#FFFFFF"/>
  <rect x="330" y="204" width="72" height="26" rx="8" fill="#FFFFFF"/>
  <rect x="230" y="240" width="290" height="30" fill="#4A7C59"/>
  <rect x="230" y="240" width="290" height="8" fill="#568A63"/>
  <!-- voilage de moustiquaire -->
  <path d="M224 150 q90 -6 150 24 q-80 6 -150 -6 z" fill="#FFFFFF" opacity="0.55"/>

  <!-- table de chevet et lampe -->
  <rect x="546" y="238" width="66" height="52" rx="4" fill="#8A6A4A"/>
  <rect x="552" y="252" width="54" height="4" fill="#6B4A2F"/>
  <rect x="572" y="212" width="14" height="26" fill="#9E552F"/>
  <path d="M562 212 h34 l-8 -22 h-18 z" fill="#C97B3C"/>

  <!-- armoire -->
  <rect x="52" y="188" width="120" height="102" rx="4" fill="#B08A62"/>
  <line x1="112" y1="188" x2="112" y2="290" stroke="#8A6A4A" stroke-width="3"/>
  <circle cx="104" cy="238" r="4" fill="#EFE6D8"/>
  <circle cx="120" cy="238" r="4" fill="#EFE6D8"/>
