<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Terrain à vendre à Ouagadougou">
  <defs>
    <linearGradient id="cielT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE0E8"/><stop offset="1" stop-color="#EADFC8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#cielT)"/>
  <rect y="230" width="640" height="170" fill="#B5653C"/>
  <rect y="230" width="640" height="10" fill="#9E552F"/>

  <!-- parcelle délimitée, vue en perspective -->
  <polygon points="140,268 500,268 580,372 60,372" fill="#C57B50" stroke="#8E4E2C" stroke-width="3"/>
  <g stroke="#8E4E2C" stroke-width="2" stroke-dasharray="10 8">
    <line x1="320" y1="268" x2="320" y2="372"/>
  </g>

  <!-- bornes d'angle -->
  <g fill="#EADFC8" stroke="#8E4E2C" stroke-width="2">
    <rect x="132" y="256" width="16" height="20" rx="2"/>
    <rect x="492" y="256" width="16" height="20" rx="2"/>
    <rect x="52" y="360" width="16" height="20" rx="2"/>
    <rect x="572" y="360" width="16" height="20" rx="2"/>
  </g>

  <!-- panneau parcelle -->
  <rect x="298" y="176" width="10" height="94" fill="#7A5A3A"/>
  <rect x="238" y="150" width="130" height="56" rx="6" fill="#C97B3C"/>
  <text x="303" y="176" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">PARCELLE</text>
  <text x="303" y="194" font-family="Arial, Helvetica, sans-serif" font-size="11"
        fill="#F6E7D5" text-anchor="middle">à vendre — Ouagadougou</text>

  <!-- quelques arbustes secs, paysage sahélien -->
  <g fill="#4A7C59">
    <circle cx="96" cy="248" r="14"/><circle cx="112" cy="252" r="10"/>
    <circle cx="548" cy="246" r="16"/><circle cx="566" cy="252" r="11"/>
  </g>
  <g fill="#6B4A2F">
    <rect x="94" y="254" width="5" height="16"/><rect x="546" y="254" width="5" height="18"/>
  </g>
</svg>
