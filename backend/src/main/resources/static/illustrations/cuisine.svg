<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Cuisine">
  <rect width="640" height="400" fill="#EFE9DE"/>
  <!-- faïence murale -->
  <rect y="120" width="640" height="110" fill="#DCE7E4"/>
  <g stroke="#C9D8D4" stroke-width="2">
    <line x1="0" y1="156" x2="640" y2="156"/><line x1="0" y1="194" x2="640" y2="194"/>
    <line x1="80" y1="120" x2="80" y2="230"/><line x1="200" y1="120" x2="200" y2="230"/>
    <line x1="320" y1="120" x2="320" y2="230"/><line x1="440" y1="120" x2="440" y2="230"/>
    <line x1="560" y1="120" x2="560" y2="230"/>
  </g>
  <rect y="300" width="640" height="100" fill="#D8CBB8"/>
  <g stroke="#C4B49F" stroke-width="2">
    <line x1="0" y1="336" x2="640" y2="336"/><line x1="0" y1="368" x2="640" y2="368"/>
    <line x1="160" y1="300" x2="130" y2="400"/><line x1="400" y1="300" x2="420" y2="400"/>
  </g>

  <!-- plan de travail et meubles bas -->
  <rect x="40" y="230" width="560" height="14" rx="3" fill="#8A9BA8"/>
  <rect x="40" y="244" width="560" height="58" fill="#4A7C59"/>
  <g stroke="#3F6B4C" stroke-width="3">
    <line x1="180" y1="244" x2="180" y2="302"/><line x1="320" y1="244" x2="320" y2="302"/>
    <line x1="460" y1="244" x2="460" y2="302"/>
  </g>
  <g fill="#EFE9DE">
    <rect x="150" y="262" width="22" height="5" rx="2"/><rect x="290" y="262" width="22" height="5" rx="2"/>
    <rect x="430" y="262" width="22" height="5" rx="2"/><rect x="560" y="262" width="22" height="5" rx="2"/>
  </g>

  <!-- évier -->
  <rect x="82" y="234" width="90" height="8" rx="2" fill="#B7C3CC"/>
  <path d="M120 234 v-30 q0 -10 12 -10 h20" stroke="#8A9BA8" stroke-width="6" fill="none"/>

  <!-- réchaud à gaz, courant à Ouagadougou -->
  <rect x="360" y="212" width="96" height="20" rx="4" fill="#6E7C88"/>
  <circle cx="386" cy="222" r="7" fill="#3B4750"/>
  <circle cx="430" cy="222" r="7" fill="#3B4750"/>
  <rect x="470" y="244" width="30" height="58" rx="4" fill="#C97B3C"/>

  <!-- étagère haute -->
  <rect x="80" y="92" width="200" height="10" rx="3" fill="#8A6A4A"/>
  <g fill="#B5653C">
    <ellipse cx="118" cy="82" rx="16" ry="10"/><ellipse cx="160" cy="82" rx="14" ry="9"/>
  </g>
  <rect x="200" y="66" width="20" height="26" rx="3" fill="#4A7C59"/>
  <rect x="228" y="70" width="18" height="22" rx="3" fill="#C97B3C"/>

  <!-- fenêtre -->
  <rect x="470" y="60" width="130" height="90" rx="4" fill="#B9D4E0"/>
  <rect x="470" y="60" width="130" height="90" rx="4" fill="none" stroke="#C9AC8C" stroke-width="6"/>
  <line x1="535" y1="60" x2="535" y2="150" stroke="#D9E7EE" stroke-width="3"/>
</svg>
