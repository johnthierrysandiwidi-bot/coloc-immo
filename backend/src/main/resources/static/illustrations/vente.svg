  <text x="542" y="193" font-family="Arial, Helvetica, sans-serif" font-size="11"
        fill="#F6E7D5" text-anchor="middle">Ouagadougou</text>

  <rect x="76" y="238" width="12" height="58" fill="#6B4A2F"/>
  <circle cx="82" cy="228" r="32" fill="#4A7C59"/>
  <circle cx="56" cy="240" r="20" fill="#3F6B4C"/>
  <circle cx="108" cy="240" r="20" fill="#568A63"/>
